<!DOCTYPE html>
<html lang="en">
<head>

  <title>Book Search SPA</title>

</head>
<body>

    <h1>Book Search</h1>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Saved Books</a>
